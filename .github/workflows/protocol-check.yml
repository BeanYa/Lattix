name: protocol-check

# 协议兼容性门禁：src/shared/messages.go 变更的 PR 必须保持协议行只增不减
# （见 scripts/check-protocol-compat.sh 头部注释）。

on:
  pull_request:
    paths:
      - src/shared/messages.go

permissions:
  contents: read

jobs:
  compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch base branch
        run: git fetch origin ${{ github.base_ref }} --depth=1
      - name: Check protocol compatibility against base branch
        run: bash scripts/check-protocol-compat.sh FETCH_HEAD
