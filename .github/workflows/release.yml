name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Verify tag is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} is not on main branch, aborting release."
            exit 1
          fi

      # 两段式发布闸门：tag 必须指向 main CI 已绿的提交。tag 先于 ci 推送时
      # （一次性流程）在此等待其完成；ci 失败或不存在则快速失败，避免发布
      # 未经验证的提交。
      - name: Gate on main CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 45); do
            row="$(gh run list --workflow=ci --limit 15 --json headSha,status,conclusion 2>/dev/null \
              | jq -r --arg sha "${GITHUB_SHA}" \
                '([.[] | select(.headSha == $sha)][0] // "none")
                 | if type == "string" then "none/-"
                   else (.status // "none") + "/" + (.conclusion // "-") end')"
            case "${row}" in
              completed/success)
                echo ">> main CI 已绿（${GITHUB_SHA}），继续发布"
                exit 0
                ;;
              completed/*)
                echo "::error::该提交的 main CI 结论为 ${row#completed/}，禁止发布。请修复后重推 main，再把 tag 移到绿提交。"
                exit 1
                ;;
            esac
            if [ "$i" -eq 1 ]; then
              echo ">> 等待 main CI 完成（${GITHUB_SHA}）…"
            fi
            sleep 20
          done
          echo "::error::等待 main CI 超时（15 分钟）。请确认 main 已推送且 ci 运行存在（push 事件偶发丢失时补推空提交），再重推 tag。"
          exit 1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.10'
          cache-dependency-path: |
            src/backend/go.sum
            src/agent/go.sum

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Build embedded frontend
        working-directory: src/frontend
        run: |
          bun install --frozen-lockfile
          bun run build
          rm -rf ../backend/internal/web/dist
          mkdir -p ../backend/internal/web/dist
          cp -a dist/. ../backend/internal/web/dist/

      - name: Test
        run: |
          bash -n install.sh
          find scripts -name '*.sh' -exec bash -n {} +
          bash scripts/e2e/install-entry.sh
          go test ./src/backend/... ./src/agent/... ./src/shared/...

      - name: Build panel and agent
        run: |
          mkdir -p out
          LDFLAGS="-s -w -X main.version=${GITHUB_REF_NAME} -X main.githubRepo=${GITHUB_REPOSITORY}"
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -ldflags "$LDFLAGS" \
              -o "out/lattix-backend-linux-$arch" ./src/backend/cmd/backend
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -ldflags "$LDFLAGS" \
              -o "out/lattix-agent-linux-$arch" ./src/agent/cmd/agent
          done

      - name: Version consistency check
        run: |
          chmod +x out/lattix-backend-linux-amd64 out/lattix-agent-linux-amd64
          test "$(out/lattix-backend-linux-amd64 -version)" = "${GITHUB_REF_NAME}"
          test "$(out/lattix-agent-linux-amd64 -version)" = "${GITHUB_REF_NAME}"

      - name: Stamp management scripts
        run: |
          cp scripts/latx.sh out/latx
          cp scripts/latx-ag.sh out/latx-ag
          sed -i \
            -e "s|{{LATTIX_VERSION}}|${GITHUB_REF_NAME}|g" \
            -e "s|{{GITHUB_REPO}}|${GITHUB_REPOSITORY}|g" \
            out/latx out/latx-ag
          # 安装/管理脚本以仓库原样入 release 资产（不烧入占位符）：与
          # raw.githubusercontent 的 tag 内容逐字节一致，install.sh 的 release
          # 资产与 raw 回退两条下载路径可共用同一份 checksums.txt 校验。
          cp scripts/install-panel.sh scripts/install-agent.sh \
            scripts/latx.sh scripts/latx-ag.sh out/

      - name: Pack release bundles
        run: |
          for arch in amd64 arm64; do
            mkdir -p "out/panel-$arch/lattix-panel" "out/agent-$arch/lattix-agent"
            cp "out/lattix-backend-linux-$arch" "out/panel-$arch/lattix-panel/lattix-backend"
            cp out/latx "out/panel-$arch/lattix-panel/latx"
            tar -C "out/panel-$arch" -czf "out/lattix-panel-linux-$arch.tar.gz" lattix-panel

            cp "out/lattix-agent-linux-$arch" "out/agent-$arch/lattix-agent/lattix-agent"
            cp out/latx-ag "out/agent-$arch/lattix-agent/latx-ag"
            tar -C "out/agent-$arch" -czf "out/lattix-agent-linux-$arch.tar.gz" lattix-agent
          done

      - name: Generate checksums
        working-directory: out
        run: |
          sha256sum \
            lattix-panel-linux-amd64.tar.gz \
            lattix-panel-linux-arm64.tar.gz \
            lattix-agent-linux-amd64.tar.gz \
            lattix-agent-linux-arm64.tar.gz \
            install-panel.sh \
            install-agent.sh \
            latx.sh \
            latx-ag.sh \
            > checksums.txt
          cat checksums.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-assets
          path: |
            out/lattix-panel-linux-amd64.tar.gz
            out/lattix-panel-linux-arm64.tar.gz
            out/lattix-agent-linux-amd64.tar.gz
            out/lattix-agent-linux-arm64.tar.gz
            out/lattix-backend-linux-amd64
            out/install-panel.sh
            out/install-agent.sh
            out/latx.sh
            out/latx-ag.sh
            out/checksums.txt
          retention-days: 7

  # e2e 全量矩阵：scripts/e2e/ 中与 ubuntu-latest 环境兼容的脚本全数纳入。
  # 未纳入：telemetry.sh / vlessenc.sh（核心断言为真实外网数据通路）。
  # 统一注入 PANEL_BIN/AGENT_BIN/XRAY_BIN：panel.sh、event-log.sh、links.sh
  # 识别并使用 release 产物，其余脚本忽略该变量、自行 go build（脚本内建行为）。
  e2e:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - script: panel.sh
          - script: install-panel.sh
          - script: install-agent.sh
          - script: control-channel.sh
          - script: xray.sh
          - script: tls.sh
          - script: settings.sh
          - script: usernodes.sh
          - script: links.sh
          # alerts.sh 的 webhook 夹具起在 loopback，注入 SSRF 测试钩子放行私网拨号
          # （LATX_ALLOW_PRIVATE_OUTBOUND=1，仅本条目生效；生产环境严禁设置）。
          - script: alerts.sh
            allow_private_outbound: "1"
          - script: event-log.sh
          - script: reconcile.sh
          - script: upgrade.sh
          - script: agent-migrate.sh
          - script: panel-update.sh
          - script: protocols.sh
          # chains.sh 的真实流量断言打 cloudflare 外网，CI 中跳过（其余断言全量保留）。
          - script: chains.sh
            skip_external: "1"
          # groups.sh 的外部订阅夹具起在 loopback，注入 SSRF 测试钩子放行私网拨号
          # （LATX_ALLOW_PRIVATE_OUTBOUND=1，仅本条目生效；生产环境严禁设置）。
          - script: groups.sh
            allow_private_outbound: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.10'
          cache-dependency-path: |
            src/backend/go.sum
            src/agent/go.sum

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-assets
          path: out

      - name: Install xray-core
        env:
          GH_TOKEN: ${{ github.token }}
          # 与安装器回退版本及项目协议基线一致。v26.10.21 已移除 legacy reverse，
          # 新反向协议迁移完成前固定夹具，避免上游 latest 漂移改变测试输入。
          XRAY_E2E_VERSION: v26.3.27
        run: |
          TAG="${XRAY_E2E_VERSION}"
          test -n "$TAG"
          echo ">> xray e2e baseline: $TAG"
          gh release download "$TAG" --repo XTLS/Xray-core \
            --pattern Xray-linux-64.zip --output /tmp/xray.zip
          # 校验官方 .dgst 中的 SHA2-256（同 scripts/install-agent.sh）；获取不到即失败，不降级跳过。
          gh release download "$TAG" --repo XTLS/Xray-core \
            --pattern Xray-linux-64.zip.dgst --output /tmp/xray.zip.dgst
          EXPECTED="$(grep 'SHA2-256=' /tmp/xray.zip.dgst | head -1 | cut -d' ' -f2)"
          ACTUAL="$(sha256sum /tmp/xray.zip | cut -d' ' -f1)"
          if [ -z "$EXPECTED" ] || [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::xray 包校验和不匹配（期望 ${EXPECTED:-<空>}，实际 $ACTUAL）"
            exit 1
          fi
          echo ">> xray 包 SHA2-256 校验通过"
          unzip -oq /tmp/xray.zip -d /tmp/xray
          chmod +x /tmp/xray/xray
          /tmp/xray/xray version

      - name: Extract current agent
        run: |
          mkdir -p current
          tar -C current -xzf out/lattix-agent-linux-amd64.tar.gz
          mv current/lattix-agent/lattix-agent current/lattix-agent-linux-amd64

      - name: Run e2e (${{ matrix.script }})
        env:
          CHAINS_SKIP_EXTERNAL: ${{ matrix.skip_external }}
          LATX_ALLOW_PRIVATE_OUTBOUND: ${{ matrix.allow_private_outbound }}
        run: |
          chmod +x out/lattix-backend-linux-amd64 current/lattix-agent-linux-amd64
          # e2e 断言对 runner 时序敏感，历史失败多为"重跑即过"：自动重试消化
          # 偶发抖动；连续失败仍以非零退出，真实回归不会被掩盖（job 20 分钟
          # 超时兜底，不会无限拖长）。
          attempt=1
          max_attempts=3
          while [ "$attempt" -le "$max_attempts" ]; do
            status=0
            PANEL_BIN="$PWD/out/lattix-backend-linux-amd64" \
            AGENT_BIN="$PWD/current/lattix-agent-linux-amd64" \
            XRAY_BIN=/tmp/xray/xray \
              bash "scripts/e2e/${{ matrix.script }}" || status=$?
            if [ "$status" -eq 0 ]; then
              echo ">> e2e ${{ matrix.script }} 通过（第 ${attempt} 次尝试）"
              exit 0
            fi
            echo ">> e2e ${{ matrix.script }} 第 ${attempt}/${max_attempts} 次失败（退出码 ${status}）"
            attempt=$((attempt + 1))
            if [ "$attempt" -le "$max_attempts" ]; then
              sleep 20
            fi
          done
          echo "::error::e2e ${{ matrix.script }} 连续 ${max_attempts} 次失败"
          exit "$status"

  release:
    needs: [build, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-assets
          path: out

      - name: Publish GitHub Release
        run: |
          ASSETS=(
            out/lattix-panel-linux-amd64.tar.gz
            out/lattix-panel-linux-arm64.tar.gz
            out/lattix-agent-linux-amd64.tar.gz
            out/lattix-agent-linux-arm64.tar.gz
            out/install-panel.sh
            out/install-agent.sh
            out/latx.sh
            out/latx-ag.sh
            out/checksums.txt
          )
          # Release notes 三级回退：docs/CHANGELOG.md 的当前版本段 → [Unreleased] 段 → 自动生成；
          # 提取失败（如文件缺失）不阻断发布，自然落入回退。
          VERSION="${GITHUB_REF_NAME#v}"
          extract_section() {
            awk -v header="$1" '
              { sub(/\r$/, "") }
              index($0, header) == 1 { found = 1; next }
              found && /^## / { exit }
              found { print }
            ' docs/CHANGELOG.md 2>/dev/null || true
          }
          extract_section "## [${VERSION}]" > release-notes.md
          grep -q '[^[:space:]]' release-notes.md \
            || extract_section '## [Unreleased]' > release-notes.md
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${ASSETS[@]}" --clobber
            # 修复循环删 tag 重推会把既有 release 转为未挂 tag 的草稿（upload 不解除
            # 草稿态），Latest 会停留在旧版本：重新发布并挂回当前 tag。
            # 预发布版本（含连字符，如 v1.2.3-rc1）不标记 Latest。
            if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
              gh release edit "${GITHUB_REF_NAME}" --draft=false
            else
              gh release edit "${GITHUB_REF_NAME}" --draft=false --latest
            fi
          elif grep -q '[^[:space:]]' release-notes.md; then
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" --notes-file release-notes.md "${ASSETS[@]}"
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" --generate-notes "${ASSETS[@]}"
          fi

  image:
    needs: [build, e2e, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive lowercase image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Build and publish multi-architecture image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
            GITHUB_REPO=${{ github.repository }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify published manifest
        run: docker buildx imagetools inspect "${IMAGE_NAME}:${GITHUB_REF_NAME}"
