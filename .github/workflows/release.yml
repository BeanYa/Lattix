name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify tag is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} is not on main branch, aborting release."
            exit 1
          fi

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
          cache-dependency-path: |
            src/backend/go.sum
            src/agent/go.sum

      - uses: oven-sh/setup-bun@v2

      - name: Build embedded frontend
        working-directory: src/frontend
        run: |
          bun install --frozen-lockfile
          bun run build
          rm -rf ../backend/internal/web/dist
          mkdir -p ../backend/internal/web/dist
          cp -a dist/. ../backend/internal/web/dist/

      - name: Test
        run: |
          bash -n install.sh
          find scripts -name '*.sh' -exec bash -n {} +
          bash scripts/e2e/install-entry.sh
          go test ./src/backend/... ./src/agent/... ./src/shared/...

      - name: Build panel and agent
        run: |
          mkdir -p out
          LDFLAGS="-s -w -X main.version=${GITHUB_REF_NAME} -X main.githubRepo=${GITHUB_REPOSITORY}"
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -ldflags "$LDFLAGS" \
              -o "out/lattix-backend-linux-$arch" ./src/backend/cmd/backend
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -ldflags "$LDFLAGS" \
              -o "out/lattix-agent-linux-$arch" ./src/agent/cmd/agent
          done

      - name: Version consistency check
        run: |
          chmod +x out/lattix-backend-linux-amd64 out/lattix-agent-linux-amd64
          test "$(out/lattix-backend-linux-amd64 -version)" = "${GITHUB_REF_NAME}"
          test "$(out/lattix-agent-linux-amd64 -version)" = "${GITHUB_REF_NAME}"

      - name: Stamp management scripts
        run: |
          cp scripts/latx.sh out/latx
          cp scripts/latx-ag.sh out/latx-ag
          sed -i \
            -e "s|{{LATTIX_VERSION}}|${GITHUB_REF_NAME}|g" \
            -e "s|{{GITHUB_REPO}}|${GITHUB_REPOSITORY}|g" \
            out/latx out/latx-ag

      - name: Pack release bundles
        run: |
          for arch in amd64 arm64; do
            mkdir -p "out/panel-$arch/lattix-panel" "out/agent-$arch/lattix-agent"
            cp "out/lattix-backend-linux-$arch" "out/panel-$arch/lattix-panel/lattix-backend"
            cp out/latx "out/panel-$arch/lattix-panel/latx"
            tar -C "out/panel-$arch" -czf "out/lattix-panel-linux-$arch.tar.gz" lattix-panel

            cp "out/lattix-agent-linux-$arch" "out/agent-$arch/lattix-agent/lattix-agent"
            cp out/latx-ag "out/agent-$arch/lattix-agent/latx-ag"
            tar -C "out/agent-$arch" -czf "out/lattix-agent-linux-$arch.tar.gz" lattix-agent
          done

      - name: Generate checksums
        working-directory: out
        run: |
          sha256sum \
            lattix-panel-linux-amd64.tar.gz \
            lattix-panel-linux-arm64.tar.gz \
            lattix-agent-linux-amd64.tar.gz \
            lattix-agent-linux-arm64.tar.gz \
            > checksums.txt
          cat checksums.txt

      - uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: |
            out/lattix-panel-linux-amd64.tar.gz
            out/lattix-panel-linux-arm64.tar.gz
            out/lattix-agent-linux-amd64.tar.gz
            out/lattix-agent-linux-arm64.tar.gz
            out/lattix-backend-linux-amd64
            out/checksums.txt
          retention-days: 7

  e2e:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
          cache-dependency-path: |
            src/backend/go.sum
            src/agent/go.sum

      - uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: out

      - name: Install xray-core
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$(gh api repos/XTLS/Xray-core/releases/latest --jq '.tag_name')"
          test -n "$TAG"
          gh release download "$TAG" --repo XTLS/Xray-core \
            --pattern Xray-linux-64.zip --output /tmp/xray.zip
          # 校验官方 .dgst 中的 SHA2-256（同 scripts/install-agent.sh）；获取不到即失败，不降级跳过。
          gh release download "$TAG" --repo XTLS/Xray-core \
            --pattern Xray-linux-64.zip.dgst --output /tmp/xray.zip.dgst
          EXPECTED="$(grep 'SHA2-256=' /tmp/xray.zip.dgst | head -1 | cut -d' ' -f2)"
          ACTUAL="$(sha256sum /tmp/xray.zip | cut -d' ' -f1)"
          if [ -z "$EXPECTED" ] || [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::xray 包校验和不匹配（期望 ${EXPECTED:-<空>}，实际 $ACTUAL）"
            exit 1
          fi
          echo ">> xray 包 SHA2-256 校验通过"
          unzip -oq /tmp/xray.zip -d /tmp/xray
          chmod +x /tmp/xray/xray

      - name: Extract current agent
        run: |
          mkdir -p current
          tar -C current -xzf out/lattix-agent-linux-amd64.tar.gz
          mv current/lattix-agent/lattix-agent current/lattix-agent-linux-amd64

      - name: Current protocol e2e
        run: |
          chmod +x out/lattix-backend-linux-amd64 current/lattix-agent-linux-amd64
          PANEL_BIN="$PWD/out/lattix-backend-linux-amd64" \
          AGENT_BIN="$PWD/current/lattix-agent-linux-amd64" \
          XRAY_BIN=/tmp/xray/xray \
            bash scripts/e2e/panel.sh

  release:
    needs: [build, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: out

      - name: Publish GitHub Release
        run: |
          ASSETS=(
            out/lattix-panel-linux-amd64.tar.gz
            out/lattix-panel-linux-arm64.tar.gz
            out/lattix-agent-linux-amd64.tar.gz
            out/lattix-agent-linux-arm64.tar.gz
            out/checksums.txt
          )
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${ASSETS[@]}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" --generate-notes "${ASSETS[@]}"
          fi

  image:
    needs: [build, e2e, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive lowercase image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Build and publish multi-architecture image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
            GITHUB_REPO=${{ github.repository }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify published manifest
        run: docker buildx imagetools inspect "${IMAGE_NAME}:${GITHUB_REF_NAME}"
