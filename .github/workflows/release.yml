name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache-dependency-path: |
            src/backend/go.sum
            src/agent/go.sum

      - uses: oven-sh/setup-bun@v2

      - name: Build embedded frontend
        working-directory: src/frontend
        run: |
          bun install --frozen-lockfile
          bun run build
          rm -rf ../backend/internal/web/dist
          mkdir -p ../backend/internal/web/dist
          cp -a dist/. ../backend/internal/web/dist/

      - name: Test
        run: |
          bash -n install.sh
          find scripts -maxdepth 1 -name '*.sh' -exec bash -n {} +
          bash scripts/dev-e2e-install-entry.sh
          go test ./src/backend/... ./src/agent/... ./src/shared/...

      - name: Build panel and agent
        run: |
          mkdir -p out
          LDFLAGS="-s -w -X main.version=${GITHUB_REF_NAME} -X main.githubRepo=${GITHUB_REPOSITORY}"
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -ldflags "$LDFLAGS" \
              -o "out/lattix-backend-linux-$arch" ./src/backend/cmd/backend
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -ldflags "$LDFLAGS" \
              -o "out/lattix-agent-linux-$arch" ./src/agent/cmd/agent
          done

      - name: Version consistency check
        run: |
          chmod +x out/lattix-backend-linux-amd64 out/lattix-agent-linux-amd64
          test "$(out/lattix-backend-linux-amd64 -version)" = "${GITHUB_REF_NAME}"
          test "$(out/lattix-agent-linux-amd64 -version)" = "${GITHUB_REF_NAME}"

      - name: Stamp management scripts
        run: |
          cp scripts/latx.sh out/latx
          cp scripts/latx-ag.sh out/latx-ag
          sed -i \
            -e "s|{{LATTIX_VERSION}}|${GITHUB_REF_NAME}|g" \
            -e "s|{{GITHUB_REPO}}|${GITHUB_REPOSITORY}|g" \
            out/latx out/latx-ag

      - name: Pack release bundles
        run: |
          for arch in amd64 arm64; do
            mkdir -p "out/panel-$arch/lattix-panel" "out/agent-$arch/lattix-agent"
            cp "out/lattix-backend-linux-$arch" "out/panel-$arch/lattix-panel/lattix-backend"
            cp out/latx "out/panel-$arch/lattix-panel/latx"
            tar -C "out/panel-$arch" -czf "out/lattix-panel-linux-$arch.tar.gz" lattix-panel

            cp "out/lattix-agent-linux-$arch" "out/agent-$arch/lattix-agent/lattix-agent"
            cp out/latx-ag "out/agent-$arch/lattix-agent/latx-ag"
            tar -C "out/agent-$arch" -czf "out/lattix-agent-linux-$arch.tar.gz" lattix-agent
          done

      - name: Generate checksums
        working-directory: out
        run: |
          sha256sum \
            lattix-panel-linux-amd64.tar.gz \
            lattix-panel-linux-arm64.tar.gz \
            lattix-agent-linux-amd64.tar.gz \
            lattix-agent-linux-arm64.tar.gz \
            > checksums.txt
          cat checksums.txt

      - uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: |
            out/lattix-panel-linux-amd64.tar.gz
            out/lattix-panel-linux-arm64.tar.gz
            out/lattix-agent-linux-amd64.tar.gz
            out/lattix-agent-linux-arm64.tar.gz
            out/lattix-backend-linux-amd64
            out/checksums.txt
          retention-days: 7

  e2e:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache-dependency-path: |
            src/backend/go.sum
            src/agent/go.sum

      - uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: out

      - name: Install xray-core
        run: |
          TAG="$(curl -fsSL https://api.github.com/repos/XTLS/Xray-core/releases/latest \
            | grep -o '"tag_name": *"[^"]*"' | head -1 | cut -d'"' -f4)"
          test -n "$TAG"
          curl -fsSL -o /tmp/xray.zip \
            "https://github.com/XTLS/Xray-core/releases/download/${TAG}/Xray-linux-64.zip"
          unzip -oq /tmp/xray.zip -d /tmp/xray
          chmod +x /tmp/xray/xray

      - name: Extract current agent
        run: |
          mkdir -p current
          tar -C current -xzf out/lattix-agent-linux-amd64.tar.gz
          mv current/lattix-agent/lattix-agent current/lattix-agent-linux-amd64

      - name: Current protocol e2e
        run: |
          chmod +x out/lattix-backend-linux-amd64 current/lattix-agent-linux-amd64
          PANEL_BIN="$PWD/out/lattix-backend-linux-amd64" \
          AGENT_BIN="$PWD/current/lattix-agent-linux-amd64" \
          XRAY_BIN=/tmp/xray/xray \
            bash scripts/dev-e2e-panel.sh

  release:
    needs: [build, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: out

      - name: Publish GitHub Release
        run: |
          ASSETS=(
            out/lattix-panel-linux-amd64.tar.gz
            out/lattix-panel-linux-arm64.tar.gz
            out/lattix-agent-linux-amd64.tar.gz
            out/lattix-agent-linux-arm64.tar.gz
            out/checksums.txt
          )
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${ASSETS[@]}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" --generate-notes "${ASSETS[@]}"
          fi

  image:
    needs: [build, e2e, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish multi-architecture image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
            GITHUB_REPO=${{ github.repository }}
          tags: |
            ghcr.io/beanya/lattix:${{ github.ref_name }}
            ghcr.io/beanya/lattix:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify published manifest
        run: docker buildx imagetools inspect "ghcr.io/beanya/lattix:${GITHUB_REF_NAME}"
