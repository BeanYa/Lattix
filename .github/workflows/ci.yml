name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run test
      - run: bun run lint
      - run: bun run build
      # picomatch <= 4.0.7 的 ReDoS 通告 GHSA-fc5q-39xc-vjpf 目前没有修复版本（patched: null）；
      # 该依赖只用于构建期的 glob 解析（vite/vitest -> tinyglobby -> fdir），不进入产物运行时。
      # 待 picomatch > 4.0.7 发布后删除 --ignore 并升级依赖。
      - run: bun audit --audit-level high --ignore=GHSA-fc5q-39xc-vjpf

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.11'
          cache-dependency-path: |
            src/backend/go.sum
            src/agent/go.sum
      - name: Validate shell scripts
        run: |
          bash -n install.sh
          find scripts -name '*.sh' -exec bash -n {} +
      - run: go test ./src/backend/... ./src/agent/... ./src/shared/...
      - run: go vet ./src/backend/... ./src/agent/... ./src/shared/...
      - run: go test -race ./src/backend/... ./src/agent/... ./src/shared/...
      - name: Scan Go dependencies
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          GOVULNCHECK="$(go env GOPATH)/bin/govulncheck"
          for module in src/backend src/agent src/shared; do
            (cd "$module" && "$GOVULNCHECK" ./...)
          done
