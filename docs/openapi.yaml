      parameters:
        - {$ref: '#/components/parameters/CSRFToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {$ref: '#/components/requestBodies/RPCBody'}
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}, default: {$ref: '#/components/responses/ProtocolErrorResponse'}}
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: lattix_session
  parameters:
    ServerID:
      name: server_id
      in: query
      required: true
      schema: {type: integer, minimum: 1}
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Session-bound token returned by `/api/auth/login` and `/api/auth/me`.
      schema: {type: string, minLength: 1}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated key scoped to the authenticated operator and RPC route.
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: '^[A-Za-z0-9._:-]+$'
  requestBodies:
    RPCBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
  responses:
    RPCResponse:
      description: Completed Lattix RPC; inspect body code for business outcome.
      headers:
        X-Request-ID:
          schema: {$ref: '#/components/schemas/MessageID'}
        X-Trace-ID:
          schema: {$ref: '#/components/schemas/MessageID'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/RPCEnvelope'}
    ProtocolErrorResponse:
      description: Protocol-layer HTTP 400, 404, 405, 413, 415, or 429 response.
      headers:
        X-Request-ID:
          schema: {$ref: '#/components/schemas/MessageID'}
        X-Trace-ID:
          schema: {$ref: '#/components/schemas/MessageID'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ProtocolError'}
    RateLimitErrorResponse:
      description: Request rejected by a bounded authentication workload or login rate limiter.
      headers:
        Retry-After:
          description: Whole seconds before the client should retry.
          schema: {type: integer, minimum: 1}
        X-Request-ID:
          schema: {$ref: '#/components/schemas/MessageID'}
        X-Trace-ID:
          schema: {$ref: '#/components/schemas/MessageID'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ProtocolError'}
  schemas:
    MessageID:
      type: string
      pattern: '^[0-9a-f]{32}$'
    CertInfo:
      type: object
      additionalProperties: false
      required: [common_name, dns_names, not_after, expired]
      properties:
        common_name: {type: string}
        dns_names:
          type: array
          items: {type: string}
          default: []
        not_after: {type: string, format: date-time}
        expired: {type: boolean}
    VirtualConfig:
      type: object
      additionalProperties: false
      required: [protocol, template]
      properties:
        protocol: {type: string}
        port: {type: integer, minimum: 1, maximum: 65535}
        flow: {type: string}
        network: {type: string}
        service_name: {type: string}
        path: {type: string}
        mode: {type: string}
        host: {type: string}
        method: {type: string}
        fingerprint: {type: string}
        encryption: {type: string}
        template:
          type: object
          additionalProperties: true
    CommandStatus:
      type: string
      enum: [queued, sent, acked, failed, abandoned]
    AgentSettings:
      type: object
      additionalProperties: false
      required: [revision, reconnect, telemetry, drift_detection]
      properties:
        revision:
          type: integer
          minimum: 1
          description: Read-only to clients; panel increments it when saving.
        reconnect:
          type: object
          additionalProperties: false
          required: [mode, max_retries]
          properties:
            mode: {type: string, enum: [infinite, limited], default: infinite}
            max_retries: {type: integer, minimum: 1, maximum: 100, default: 10}
        telemetry:
          type: object
          additionalProperties: false
          required: [interval_seconds]
          properties:
            interval_seconds: {type: integer, minimum: 10, maximum: 3600, default: 60}
        drift_detection:
          type: object
          additionalProperties: false
          required: [interval_seconds]
          properties:
            interval_seconds: {type: integer, minimum: 5, maximum: 3600, default: 15}
    SettingUpdateRequest:
      type: object
      description: Existing panel fields plus the complete global Agent settings object.
      additionalProperties: true
      properties:
        traffic_timezone:
          type: string
          default: Asia/Shanghai
          description: IANA timezone used for chain traffic day/month bucket boundaries.
        server_settings:
          type: object
          additionalProperties: false
          required: [xray_version]
          properties:
            xray_version:
              type: string
              nullable: true
              default: latest
              description: 面板级默认 xray 版本（latest 或 vX.Y.Z）；服务器可单独覆盖。
        agent: {$ref: '#/components/schemas/AgentSettings'}
        release_inspection: {$ref: '#/components/schemas/ReleaseInspectionSettings'}
        billing_inspection: {$ref: '#/components/schemas/InspectionSchedule'}
        exchange_rate_inspection: {$ref: '#/components/schemas/InspectionSchedule'}
        reporting_currency: {$ref: '#/components/schemas/Currency'}
    Currency:
      type: string
      description: Supported ISO 4217 currency code.
      enum: [AUD, BRL, CAD, CHF, CNY, CZK, DKK, EUR, GBP, HKD, HUF, IDR, ILS, INR, ISK, JPY, KRW, MXN, MYR, NOK, NZD, PHP, PLN, RON, SEK, SGD, THB, TRY, USD, ZAR]
    BillingInput:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled: {type: boolean, default: false}
        provider_id: {type: integer, minimum: 1}
        amount_minor: {type: integer, minimum: 0, description: Original price in the currency's minor unit.}
        currency: {$ref: '#/components/schemas/Currency'}
        service_started_on: {type: string, format: date}
        interval_count: {type: integer, minimum: 1, maximum: 10000}
        interval_unit: {type: string, enum: [day, month, year]}
        next_renewal_on: {type: string, format: date}
    ConvertedCost:
      type: object
      additionalProperties: false
      required: [amount_minor, currency, rate_date, source]
      properties:
        amount_minor: {type: integer, description: Converted value in the reporting currency's minor unit.}
        currency: {$ref: '#/components/schemas/Currency'}
        rate_date: {type: string, description: Public cache date; empty for an identity conversion.}
        source: {type: string, enum: [identity, frankfurter, custom_anchor]}
        anchor_currency: {type: string, description: Present for custom_anchor results.}
    BillingProfile:
      type: object
      description: Server billing data. Public conversion is always attempted; custom conversion is present only when an enabled anchor target matches the reporting currency.
      properties:
        enabled: {type: boolean}
        amount_minor: {type: integer}
        currency: {$ref: '#/components/schemas/Currency'}
        public_converted: {$ref: '#/components/schemas/ConvertedCost'}
        custom_converted: {$ref: '#/components/schemas/ConvertedCost'}
    BillingStatsGranularity:
      type: string
      enum: [day, month, year]
    BillingStatsRateMode:
      type: string
      enum: [public, custom]
      default: custom
    BillingActualServerStats:
      type: object
      description: Per-server cost series aligned with BillingActualStats.periods. Day granularity labels are YYYY-MM-DD, month YYYY-MM, year YYYY. Costs are in the reporting currency minor unit, rounded per cell; custom arrays are present when custom_available and rate_mode=custom.
      additionalProperties: false
      required: [server_id, alias, country_code, location, currency, amount_minor, interval_count, interval_unit, service_started_on, status, days_active, daily_minor, actual_costs_public]
      properties:
        server_id: {type: integer}
        alias: {type: string}
        country_code: {type: string, description: ISO 3166-1 alpha-2.}
        location: {type: string}
        currency: {$ref: '#/components/schemas/Currency'}
        amount_minor: {type: integer, description: Original price in the server currency minor unit.}
        interval_count: {type: integer, minimum: 1, maximum: 10000}
        interval_unit: {type: string, enum: [day, month, year]}
        service_started_on: {type: string, format: date}
        status: {type: string, description: Billing lifecycle status.}
        days_active: {type: integer, description: Days of service inside the requested range.}
        daily_minor: {type: integer, description: Public daily cost in reporting minor unit.}
        daily_custom_minor: {type: integer, description: Custom daily cost; present when the server has a custom conversion.}
        actual_costs_public: {type: array, items: {type: integer}}
        actual_costs_custom: {type: array, items: {type: integer}, description: Present for every server when custom_available and rate_mode=custom; equals actual_costs_public for servers without a custom conversion.}
    BillingActualStats:
      type: object
      description: Cost statistics for servers with statistical billing enabled, prorated per day over the requested range and converted to the reporting currency.
      additionalProperties: false
      required: [reporting_currency, granularity, from, to, rate_mode, custom_available, periods, servers, actual_totals_public]
      properties:
        reporting_currency: {$ref: '#/components/schemas/Currency'}
        granularity: {$ref: '#/components/schemas/BillingStatsGranularity'}
        from: {type: string, format: date}
        to: {type: string, format: date}
        rate_mode: {$ref: '#/components/schemas/BillingStatsRateMode'}
        rate_date: {type: string, description: Public exchange rate cache date; empty when no conversion was needed.}
        custom_available: {type: boolean, description: True when at least one server's custom conversion differs from its public conversion; independent of rate_mode.}
        periods: {type: array, items: {type: string}, description: Every calendar period covering from/to.}
        servers: {type: array, items: {$ref: '#/components/schemas/BillingActualServerStats'}, description: Servers with billing enabled, ordered by server_id.}
        actual_totals_public: {type: array, items: {type: integer}, description: Per-period sum of actual_costs_public.}
        actual_totals_custom: {type: array, items: {type: integer}, description: Present when custom_available and rate_mode=custom.}
    BillingEstimatedServerStats:
      type: object
      description: Per-server estimated cost series aligned with BillingEstimatedStats.periods, computed in the 12-month/30-day convention (daily cost = price per interval days, month = daily x 30, year = daily x 360; a period cell is daily cost times its in-range days, with full months at 30 and full years at 360) regardless of service dates. Costs are in the reporting currency minor unit, rounded per cell; custom arrays are present when custom_available and rate_mode=custom.
      additionalProperties: false
      required: [server_id, alias, country_code, location, currency, amount_minor, interval_count, interval_unit, service_started_on, status, days_active, daily_minor, monthly_minor, annual_minor, estimated_costs_public]
      properties:
        server_id: {type: integer}
        alias: {type: string}
        country_code: {type: string, description: ISO 3166-1 alpha-2.}
        location: {type: string}
        currency: {$ref: '#/components/schemas/Currency'}
        amount_minor: {type: integer, description: Original price in the server currency minor unit.}
        interval_count: {type: integer, minimum: 1, maximum: 10000}
        interval_unit: {type: string, enum: [day, month, year]}
        service_started_on: {type: string, format: date}
        status: {type: string, description: Billing lifecycle status.}
        days_active: {type: integer, description: Days in the requested range (constant for every server).}
        daily_minor: {type: integer, description: Public daily cost in reporting minor unit (year-paid = price/360, month-paid = price/30, day-paid = price/count).}
        daily_custom_minor: {type: integer, description: Custom daily cost; present when the server has a custom conversion.}
        monthly_minor: {type: integer, description: Public monthly cost in reporting minor unit (= daily x 30).}
        annual_minor: {type: integer, description: Public annual cost in reporting minor unit (= daily x 360).}
        monthly_custom_minor: {type: integer, description: Custom monthly cost; present when the server has a custom conversion.}
        annual_custom_minor: {type: integer, description: Custom annual cost; present when the server has a custom conversion.}
        estimated_costs_public: {type: array, items: {type: integer}}
        estimated_costs_custom: {type: array, items: {type: integer}, description: Present for every server when custom_available and rate_mode=custom; equals estimated_costs_public for servers without a custom conversion.}
    BillingEstimatedStats:
      type: object
      description: Projected cost statistics for non-expired servers with statistical billing enabled, estimated as daily cost times in-range days per period (12-month/30-day convention; range cost = annual x full years + monthly x full months + daily x remaining days) and converted to the reporting currency.
      additionalProperties: false
      required: [reporting_currency, granularity, from, to, rate_mode, custom_available, periods, servers, estimated_totals_public]
      properties:
        reporting_currency: {$ref: '#/components/schemas/Currency'}
        granularity: {$ref: '#/components/schemas/BillingStatsGranularity'}
        from: {type: string, format: date}
        to: {type: string, format: date}
        rate_mode: {$ref: '#/components/schemas/BillingStatsRateMode'}
        rate_date: {type: string, description: Public exchange rate cache date; empty when no conversion was needed.}
        custom_available: {type: boolean, description: True when at least one server's custom conversion differs from its public conversion; independent of rate_mode.}
        periods: {type: array, items: {type: string}, description: Every calendar period covering from/to.}
        servers: {type: array, items: {$ref: '#/components/schemas/BillingEstimatedServerStats'}, description: Non-expired servers with billing enabled, ordered by server_id.}
        estimated_totals_public: {type: array, items: {type: integer}, description: Per-period sum of estimated_costs_public.}
        estimated_totals_custom: {type: array, items: {type: integer}, description: Present when custom_available and rate_mode=custom.}
    TrafficPlanInput:
      type: object
      additionalProperties: false
      required: [quota_bytes, accounting_mode, reset_anchor_on, reset_count, reset_unit]
      properties:
        quota_bytes: {type: [integer, 'null'], minimum: 1, description: Decimal bytes; null means unlimited.}
        accounting_mode: {type: string, enum: [outbound, bidirectional, max]}
        reset_anchor_on: {type: string, format: date}
        reset_count: {type: integer, minimum: 1, maximum: 10000}
        reset_unit: {type: string, enum: [day, month, year]}
    ConfirmRenewalRequest:
      type: object
      additionalProperties: false
      required: [server_id, next_renewal_on]
      properties:
        server_id: {type: integer, minimum: 1}
        next_renewal_on: {type: string, format: date, description: Must be later than today in the panel timezone.}
    ServerUpdateRequest:
      type: object
      description: Panel-editable server fields. Only the declared fields are validated here; extra fields follow existing RPC semantics.
      additionalProperties: true
      required: [server_id, alias, address, tags, country_code, location]
      properties:
        server_id: {type: integer, minimum: 1}
        alias: {type: string}
        address:
          type: string
          description: Default public address. Must be a member of addresses when addresses is provided; required non-empty for NAT machines.
        addresses:
          type: array
          items: {type: string}
          description: Optional full replacement of the public address list. Omitted keeps legacy semantics (only address is maintained). When provided, address must be a member.
        tags:
          type: array
          items: {type: string}
        country_code: {type: string}
        location: {type: string}
        billing: {$ref: '#/components/schemas/BillingInput'}
        traffic_plan: {$ref: '#/components/schemas/TrafficPlanInput'}
        custom_settings:
          type: object
          additionalProperties: true
    ChainHopRef:
      type: object
      description: Reference to one chain hop server. Response-side chain hops carry the same address field (empty string means following the server default address).
      additionalProperties: false
      required: [server_id]
      properties:
        server_id: {type: integer, minimum: 1}
        address:
          type: string
          description: Optional selected public address for this hop. Empty or omitted follows the server default address; a non-empty value must be one of the server's addresses ∪ {address, learned_addr}, otherwise the request is rejected with 400.
    ChainCreateRequest:
      type: object
      description: Ordered hop topology (entry / 0-2 middle / exit) plus the exit-side service node form. Only hop references are validated here; the node form follows the existing RPC semantics.
      additionalProperties: true
      required: [name]
      properties:
        name: {type: string}
        hops:
          type: array
          items: {$ref: '#/components/schemas/ChainHopRef'}
        entry: {$ref: '#/components/schemas/ChainHopRef'}
        middle:
          type: array
          items: {$ref: '#/components/schemas/ChainHopRef'}
        exit: {$ref: '#/components/schemas/ChainHopRef'}
        entry_port: {type: integer, minimum: 1, maximum: 65535}
        node:
          type: object
          additionalProperties: true
        traffic_multiplier: {type: string}
    ChainEditRequest:
      type: object
      description: Same hop semantics as ChainCreateRequest; creates a desired revision for the target chain.
      additionalProperties: true
      required: [chain_id, name, hops]
      properties:
        chain_id: {type: integer, minimum: 1}
        name: {type: string}
        hops:
          type: array
          items: {$ref: '#/components/schemas/ChainHopRef'}
        entry_port: {type: integer, minimum: 1, maximum: 65535}
        node:
          type: object
          additionalProperties: true
        traffic_multiplier: {type: string}
    CustomExchangeRate:
      type: object
      description: Source currency is unique. On create, target_currency is overwritten with the panel reporting currency. At least one amount must equal 1. A rate is applied only while enabled and its target matches the current reporting currency.
      additionalProperties: false
      required: [id, source_currency, source_amount, target_currency, target_amount, enabled]
      properties:
        id: {type: integer, minimum: 0, description: Zero creates a new rate; a positive ID updates it.}
        source_currency: {$ref: '#/components/schemas/Currency'}
        source_amount: {type: string, pattern: '^[0-9]+(?:\\.[0-9]+)?$', description: Source-side major-unit amount; this or target_amount must equal 1.}
        target_currency: {$ref: '#/components/schemas/Currency'}
        target_amount: {type: string, pattern: '^[0-9]+(?:\\.[0-9]+)?$', description: Reporting-currency major-unit amount; this or source_amount must equal 1.}
        enabled: {type: boolean}
    InspectionSchedule:
      type: object
      additionalProperties: false
      required: [every, unit]
      properties:
        every: {type: integer, minimum: 1, maximum: 10000}
        unit: {type: string, enum: [minute, hour, day, month, year]}
        at: {type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'}
    ReleaseInspectionSettings:
      type: object
      additionalProperties: false
      required: [agent, xray]
      properties:
        agent: {$ref: '#/components/schemas/InspectionSchedule'}
        xray: {$ref: '#/components/schemas/InspectionSchedule'}
    RPCCode:
      type: string
      enum:
        - OK
        - ACCEPTED
        - AUTH_REQUIRED
        - AUTH_INVALID_CREDENTIALS
        - INVALID_ARGUMENT
        - NOT_FOUND
        - CONFLICT
        - OPERATION_LOCKED
        - UNSUPPORTED_ACTION
        - INTERNAL_ERROR
        - UPSTREAM_ERROR
        - SERVICE_UNAVAILABLE
        - SERVER_OFFLINE
        - PORT_OUT_OF_RANGE
        - UPDATE_IN_PROGRESS
    ProtocolCode:
      type: string
      pattern: '^HTTP_[1-5][0-9]{2}$'
    ProtocolError:
      type: object
      additionalProperties: false
      required: [code, message, data, request_id, trace_id]
      properties:
        code:
          type: string
          enum: [HTTP_400, HTTP_404, HTTP_405, HTTP_413, HTTP_415, HTTP_429]
        message: {type: string}
        data: {type: 'null'}
        request_id: {$ref: '#/components/schemas/MessageID'}
        trace_id: {$ref: '#/components/schemas/MessageID'}
        observe_id: {$ref: '#/components/schemas/MessageID'}
    RPCEnvelope:
      type: object
      additionalProperties: false
      required: [code, message, data, request_id, trace_id]
      properties:
        code:
          oneOf:
            - {$ref: '#/components/schemas/RPCCode'}
            - {$ref: '#/components/schemas/ProtocolCode'}
        message: {type: string}
        data: {}
        request_id: {$ref: '#/components/schemas/MessageID'}
        trace_id: {$ref: '#/components/schemas/MessageID'}
        observe_id: {$ref: '#/components/schemas/MessageID'}
    Observation:
      type: object
      description: 旁路操作进度快照（GET /api/observe-task/get）。
      additionalProperties: false
      required: [id, kind, title, stages, stage, percent, message, status]
      properties:
        id: {type: string}
        kind: {type: string}
        title: {type: string}
        stages:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [key, label]
            properties:
              key: {type: string}
              label: {type: string}
        stage: {type: string}
        percent: {type: integer, minimum: 0, maximum: 100}
        message: {type: string}
        status: {type: string, enum: [running, done, failed]}
        warnings:
          type: array
          items: {type: string}
        error: {type: string}
        started_at: {type: string, format: date-time}
        finished_at: {type: string, format: date-time}
