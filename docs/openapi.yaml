  /api/billing/stats:
    get:
      operationId: billingStats
      parameters:
        - name: from
          in: query
          required: true
          schema: {type: string, format: date}
        - name: to
          in: query
          required: true
          schema: {type: string, format: date}
        - name: granularity
          in: query
          required: true
          schema: {$ref: '#/components/schemas/BillingStatsGranularity'}
