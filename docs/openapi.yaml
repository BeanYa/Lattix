openapi: 3.1.0
info:
  title: Lattix Panel RPC API
  version: 1.0.0
  description: |
    Lattix 自有管理 RPC。命中并完成协议解析后，业务结果由响应 body
    的 code 表达，HTTP 状态为 200。订阅、文件成功响应、WebSocket
    Upgrade、健康检查和第三方 HTTP 不使用此业务信封。
    订阅落地页客户端下载 `GET /api/sub/{token}/client-download/start`
    对新建下载任务按订阅 token 滑动窗口限流（每 token 每小时最多 10 次）：
    超限返回 HTTP 429 与 `Retry-After` 头（秒），body 为 text/plain 错误信息；
    命中活跃任务的去重请求与 status/ticket/file（含 Range 断点续传）不受此限。
servers:
  - url: /
security:
  - sessionCookie: []
paths:
  /api/auth/login:
    post:
      operationId: authLogin
      description: |
        Browser login requires a same-origin `Origin` header, or a same-origin
        `Referer` when `Origin` is absent. The source host must match the HTTP
        `Host`; requests received over HTTPS must also use an HTTPS source URL.
      security: []
      requestBody: {$ref: '#/components/requestBodies/RPCBody'}
      responses:
        '200': {$ref: '#/components/responses/RPCResponse'}
        '429': {$ref: '#/components/responses/RateLimitErrorResponse'}
        default: {$ref: '#/components/responses/ProtocolErrorResponse'}
  /api/auth/logout:
    post:
      operationId: authLogout
      parameters:
        - {$ref: '#/components/parameters/CSRFToken'}
      requestBody: {$ref: '#/components/requestBodies/RPCBody'}
      responses:
        '200': {$ref: '#/components/responses/RPCResponse'}
        default: {$ref: '#/components/responses/ProtocolErrorResponse'}
  /api/auth/me:
    get:
      operationId: authMe
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}, default: {$ref: '#/components/responses/ProtocolErrorResponse'}}
  /api/dashboard/get:
    get:
      operationId: dashboardGet
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}, default: {$ref: '#/components/responses/ProtocolErrorResponse'}}
  /api/server/list:
    get:
      operationId: serverList
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}, default: {$ref: '#/components/responses/ProtocolErrorResponse'}}
  /api/server/list-metric-samples:
    get:
      operationId: serverListMetricSamples
      parameters:
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 60, default: 30}
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}, default: {$ref: '#/components/responses/ProtocolErrorResponse'}}
  /api/server/get-metric-history:
    get:
      operationId: serverGetMetricHistory
      parameters:
        - {$ref: '#/components/parameters/ServerID'}
        - name: hours
          in: query
          schema: {type: integer, minimum: 1, maximum: 24, default: 24}
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}, default: {$ref: '#/components/responses/ProtocolErrorResponse'}}
  /api/server/list-commands:
    get:
      operationId: serverListCommands
      parameters:
        - {$ref: '#/components/parameters/ServerID'}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 200}
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}, default: {$ref: '#/components/responses/ProtocolErrorResponse'}}
  /api/server/get-test:
    get:
      operationId: serverGetTest
      parameters:
        - {$ref: '#/components/parameters/ServerID'}
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}, default: {$ref: '#/components/responses/ProtocolErrorResponse'}}
  /api/server/run-test:
    post:
      operationId: serverRunTest
      parameters:
        - {$ref: '#/components/parameters/CSRFToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {$ref: '#/components/requestBodies/RPCBody'}
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}, default: {$ref: '#/components/responses/ProtocolErrorResponse'}}
  /api/server-test/catalog-status:
    get:
      operationId: serverTestCatalogStatus
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}, default: {$ref: '#/components/responses/ProtocolErrorResponse'}}
  /api/server-test/refresh-catalog:
    post:
      operationId: serverTestRefreshCatalog
      parameters:
        - {$ref: '#/components/parameters/CSRFToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {$ref: '#/components/requestBodies/RPCBody'}
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}, default: {$ref: '#/components/responses/ProtocolErrorResponse'}}
  /api/server/create:
    post:
      operationId: serverCreate
      description: |
        响应 data 含 server、bootstrap_token、install_command 与 install_insecure（boolean）；
        install_insecure 为 true 表示安装命令走明文公网链路（面板地址为 http 且 host 非回环/私网，
        域名按公网保守处理），Agent 控制流量明文传输，token 可嗅探、命令可伪造。
      parameters:
        - {$ref: '#/components/parameters/CSRFToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {$ref: '#/components/requestBodies/RPCBody'}
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}, default: {$ref: '#/components/responses/ProtocolErrorResponse'}}
  /api/server/update:
    post:
      operationId: serverUpdate
      parameters:
        - {$ref: '#/components/parameters/CSRFToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ServerUpdateRequest'}
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}, default: {$ref: '#/components/responses/ProtocolErrorResponse'}}
  /api/server/confirm-renewal:
    post:
      operationId: serverConfirmRenewal
      parameters:
        - {$ref: '#/components/parameters/CSRFToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConfirmRenewalRequest'}
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}, default: {$ref: '#/components/responses/ProtocolErrorResponse'}}
  /api/billing/stats:
    get:
      operationId: billingStats
      parameters:
        - name: from
          in: query
          required: true
          schema: {type: string, format: date}
        - name: to
          in: query
          required: true
          schema: {type: string, format: date}
        - name: granularity
          in: query
          required: true
          schema: {$ref: '#/components/schemas/BillingStatsGranularity'}
        - name: rate_mode
          in: query
          schema: {$ref: '#/components/schemas/BillingStatsRateMode'}
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}, default: {$ref: '#/components/responses/ProtocolErrorResponse'}}
  /api/billing/stats/estimated:
    get:
      operationId: billingStatsEstimated
      parameters:
        - name: from
          in: query
          required: true
          schema: {type: string, format: date}
        - name: to
          in: query
          required: true
          schema: {type: string, format: date}
        - name: granularity
          in: query
          required: true
          schema: {$ref: '#/components/schemas/BillingStatsGranularity'}
        - name: rate_mode
          in: query
          schema: {$ref: '#/components/schemas/BillingStatsRateMode'}
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}, default: {$ref: '#/components/responses/ProtocolErrorResponse'}}
  /api/server/delete:
    post:
      operationId: serverDelete
      parameters:
        - {$ref: '#/components/parameters/CSRFToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {$ref: '#/components/requestBodies/RPCBody'}
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}, default: {$ref: '#/components/responses/ProtocolErrorResponse'}}
  /api/server/rotate-token:
    post:
      operationId: serverRotateToken
      description: |
        响应 data 字段同 serverCreate（server、bootstrap_token、install_command、install_insecure）。
      parameters:
        - {$ref: '#/components/parameters/CSRFToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {$ref: '#/components/requestBodies/RPCBody'}
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}, default: {$ref: '#/components/responses/ProtocolErrorResponse'}}
  /api/server/repair:
    post:
      operationId: serverRepair
      parameters:
        - {$ref: '#/components/parameters/CSRFToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {$ref: '#/components/requestBodies/RPCBody'}
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}, default: {$ref: '#/components/responses/ProtocolErrorResponse'}}
  /api/server/cleanup-xray:
    post:
      operationId: serverCleanupXray
      parameters:
        - {$ref: '#/components/parameters/CSRFToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {$ref: '#/components/requestBodies/RPCBody'}
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}, default: {$ref: '#/components/responses/ProtocolErrorResponse'}}
  /api/server/rebuild-xray:
    post:
      operationId: serverRebuildXray
      parameters:
        - {$ref: '#/components/parameters/CSRFToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {$ref: '#/components/requestBodies/RPCBody'}
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}, default: {$ref: '#/components/responses/ProtocolErrorResponse'}}
  /api/server/upgrade-xray:
    post:
      operationId: serverUpgradeXray
      parameters:
        - {$ref: '#/components/parameters/CSRFToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {$ref: '#/components/requestBodies/RPCBody'}
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}, default: {$ref: '#/components/responses/ProtocolErrorResponse'}}
  /api/server/upgrade-agent:
    post:
      operationId: serverUpgradeAgent
      parameters:
        - {$ref: '#/components/parameters/CSRFToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {$ref: '#/components/requestBodies/RPCBody'}
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}, default: {$ref: '#/components/responses/ProtocolErrorResponse'}}
  /api/server/list-release-versions:
    get:
      operationId: serverListReleaseVersions
      parameters:
        - name: kind
          in: query
          required: true
          schema: {type: string, enum: [agent, xray]}
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}, default: {$ref: '#/components/responses/ProtocolErrorResponse'}}
  /api/provider/list:
    get:
      operationId: providerList
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}, default: {$ref: '#/components/responses/ProtocolErrorResponse'}}
  /api/provider/create:
    post:
      operationId: providerCreate
      parameters:
        - {$ref: '#/components/parameters/CSRFToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {$ref: '#/components/requestBodies/RPCBody'}
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}, default: {$ref: '#/components/responses/ProtocolErrorResponse'}}
  /api/provider/update:
    post:
      operationId: providerUpdate
      parameters:
        - {$ref: '#/components/parameters/CSRFToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {$ref: '#/components/requestBodies/RPCBody'}
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}, default: {$ref: '#/components/responses/ProtocolErrorResponse'}}
  /api/provider/delete:
    post:
      operationId: providerDelete
      parameters:
        - {$ref: '#/components/parameters/CSRFToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {$ref: '#/components/requestBodies/RPCBody'}
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}, default: {$ref: '#/components/responses/ProtocolErrorResponse'}}
  /api/exchange-rate/list:
    get:
      operationId: exchangeRateList
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}, default: {$ref: '#/components/responses/ProtocolErrorResponse'}}
  /api/exchange-rate/refresh:
    post:
      operationId: exchangeRateRefresh
      parameters:
        - {$ref: '#/components/parameters/CSRFToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {$ref: '#/components/requestBodies/RPCBody'}
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}, default: {$ref: '#/components/responses/ProtocolErrorResponse'}}
  /api/exchange-rate/save-custom:
    post:
      operationId: exchangeRateSaveCustom
      parameters:
        - {$ref: '#/components/parameters/CSRFToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CustomExchangeRate'}
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}, default: {$ref: '#/components/responses/ProtocolErrorResponse'}}
  /api/exchange-rate/delete-custom:
    post:
      operationId: exchangeRateDeleteCustom
      parameters:
        - {$ref: '#/components/parameters/CSRFToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {$ref: '#/components/requestBodies/RPCBody'}
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}, default: {$ref: '#/components/responses/ProtocolErrorResponse'}}
  /api/node/list:
    get:
      operationId: nodeList
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}, default: {$ref: '#/components/responses/ProtocolErrorResponse'}}
  /api/node/create:
    post:
      operationId: nodeCreate
      parameters:
        - {$ref: '#/components/parameters/CSRFToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {$ref: '#/components/requestBodies/RPCBody'}
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}, default: {$ref: '#/components/responses/ProtocolErrorResponse'}}
  /api/node/retry:
    post:
      operationId: nodeRetry
      parameters:
        - {$ref: '#/components/parameters/CSRFToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {$ref: '#/components/requestBodies/RPCBody'}
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}, default: {$ref: '#/components/responses/ProtocolErrorResponse'}}
  /api/node/delete:
    post:
      operationId: nodeDelete
      parameters:
        - {$ref: '#/components/parameters/CSRFToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {$ref: '#/components/requestBodies/RPCBody'}
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}, default: {$ref: '#/components/responses/ProtocolErrorResponse'}}
  /api/chain/list:
    get:
      operationId: chainList
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}, default: {$ref: '#/components/responses/ProtocolErrorResponse'}}
  /api/chain/create:
    post:
      operationId: chainCreate
      parameters:
        - {$ref: '#/components/parameters/CSRFToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChainCreateRequest'}
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}, default: {$ref: '#/components/responses/ProtocolErrorResponse'}}
  /api/chain/edit:
    post:
      operationId: chainEdit
      description: Creates a desired revision for ordered 1-4 hop topology and deploys changed pieces exit-to-entry.
      parameters:
        - {$ref: '#/components/parameters/CSRFToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChainEditRequest'}
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}, default: {$ref: '#/components/responses/ProtocolErrorResponse'}}
  /api/chain/force-publish:
    post:
      operationId: chainForcePublish
      description: Immediately promotes the desired revision as unconfirmed; queued Agent tasks continue without rollback.
      parameters:
        - {$ref: '#/components/parameters/CSRFToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {$ref: '#/components/requestBodies/RPCBody'}
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}, default: {$ref: '#/components/responses/ProtocolErrorResponse'}}
  /api/chain/set-traffic-multiplier:
    post:
      operationId: chainSetTrafficMultiplier
      parameters:
        - {$ref: '#/components/parameters/CSRFToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {$ref: '#/components/requestBodies/RPCBody'}
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}, default: {$ref: '#/components/responses/ProtocolErrorResponse'}}
  /api/chain/reset-traffic:
    post:
      operationId: chainResetTraffic
      parameters:
        - {$ref: '#/components/parameters/CSRFToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {$ref: '#/components/requestBodies/RPCBody'}
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}, default: {$ref: '#/components/responses/ProtocolErrorResponse'}}
  /api/chain/get-traffic-history:
    get:
      operationId: chainGetTrafficHistory
      parameters:
        - {name: chain_id, in: query, required: true, schema: {type: integer, minimum: 1}}
        - {name: hop_id, in: query, schema: {type: integer, minimum: 0, default: 0}}
        - {name: days, in: query, schema: {type: integer, minimum: 1, maximum: 730, default: 30}}
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}, default: {$ref: '#/components/responses/ProtocolErrorResponse'}}
  /api/chain/retry:
    post:
      operationId: chainRetry
      parameters:
        - {$ref: '#/components/parameters/CSRFToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {$ref: '#/components/requestBodies/RPCBody'}
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}, default: {$ref: '#/components/responses/ProtocolErrorResponse'}}
  /api/chain/delete:
    post:
      operationId: chainDelete
      parameters:
        - {$ref: '#/components/parameters/CSRFToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {$ref: '#/components/requestBodies/RPCBody'}
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}, default: {$ref: '#/components/responses/ProtocolErrorResponse'}}
  /api/user/list:
    get:
      operationId: userList
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}, default: {$ref: '#/components/responses/ProtocolErrorResponse'}}
  /api/user/create:
    post:
      operationId: userCreate
      description: 创建真实用户；chain_ids 为直接链路分配，每项生成独立 access_uuid。
      parameters:
        - {$ref: '#/components/parameters/CSRFToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {$ref: '#/components/requestBodies/RPCBody'}
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}, default: {$ref: '#/components/responses/ProtocolErrorResponse'}}
  /api/user/update:
    post:
      operationId: userUpdate
      parameters:
        - {$ref: '#/components/parameters/CSRFToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {$ref: '#/components/requestBodies/RPCBody'}
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}, default: {$ref: '#/components/responses/ProtocolErrorResponse'}}
  /api/user/set-nodes:
    post:
      operationId: userSetNodes
      description: |
        完整替换期望分配。node_ids 保留独立节点兼容；chain_ids 是用户与链的直接多对多分配。
        未变化的链分配保留 access_uuid，新增分配生成新凭证并重算共享入口。
      parameters:
        - {$ref: '#/components/parameters/CSRFToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {$ref: '#/components/requestBodies/RPCBody'}
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}, default: {$ref: '#/components/responses/ProtocolErrorResponse'}}
  /api/user/set-external-subscriptions:
    post:
      operationId: userSetExternalSubscriptions
      description: |
        整表替换用户引入的外部订阅及其模式（叠加 stack / 并入 merge / 附加 nodes）。
        保存后重发布该用户的订阅快照。
      parameters:
        - {$ref: '#/components/parameters/CSRFToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {$ref: '#/components/requestBodies/RPCBody'}
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}, default: {$ref: '#/components/responses/ProtocolErrorResponse'}}
  /api/user/delete:
    post:
      operationId: userDelete
      parameters:
        - {$ref: '#/components/parameters/CSRFToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {$ref: '#/components/requestBodies/RPCBody'}
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}, default: {$ref: '#/components/responses/ProtocolErrorResponse'}}
  /api/user/sub-settings:
    post:
      operationId: userSubSettings
      parameters:
        - {$ref: '#/components/parameters/CSRFToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {$ref: '#/components/requestBodies/RPCBody'}
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}, default: {$ref: '#/components/responses/ProtocolErrorResponse'}}
  /api/user/traffic-history:
    get:
      operationId: userTrafficHistory
      parameters:
        - {name: user_id, in: query, required: true, schema: {type: integer, minimum: 1}}
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}, default: {$ref: '#/components/responses/ProtocolErrorResponse'}}
  /api/user/regenerate-subscription:
    post:
      operationId: userRegenerateSubscription
      parameters:
        - {$ref: '#/components/parameters/CSRFToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {$ref: '#/components/requestBodies/RPCBody'}
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}, default: {$ref: '#/components/responses/ProtocolErrorResponse'}}
  /api/user/reset-subscription-token:
    post:
      operationId: userResetSubscriptionToken
      parameters:
        - {$ref: '#/components/parameters/CSRFToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {$ref: '#/components/requestBodies/RPCBody'}
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}, default: {$ref: '#/components/responses/ProtocolErrorResponse'}}
  /api/user/subscription-preview:
    get:
      operationId: userSubscriptionPreview
      parameters:
        - {name: user_id, in: query, required: true, schema: {type: integer, minimum: 1}}
        - {name: format, in: query, required: true, schema: {type: string, enum: [clash, singbox, quanx, quanx-config, links]}}
        - name: stage
          in: query
          required: false
          description: 预览阶段：final（默认，正式交付内容）或 pre（预编译中间态，占位符未解压）
          schema: {type: string, enum: [final, pre]}
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}, default: {$ref: '#/components/responses/ProtocolErrorResponse'}}
  /api/subscription/categories:
    get:
      operationId: subscriptionCategoryList
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}, default: {$ref: '#/components/responses/ProtocolErrorResponse'}}
  /api/subscription/templates:
    get:
      operationId: subscriptionTemplateList
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}, default: {$ref: '#/components/responses/ProtocolErrorResponse'}}
  /api/subscription/template/save:
    post:
      operationId: subscriptionTemplateSave
      parameters:
        - {$ref: '#/components/parameters/CSRFToken'}
