openapi: 3.1.0
info:
  title: Lattix Panel RPC API
  version: 1.0.0
  description: |
    Lattix 自有管理 RPC。命中并完成协议解析后，业务结果由响应 body
    的 code 表达，HTTP 状态为 200。订阅、文件成功响应、WebSocket
    Upgrade、健康检查和第三方 HTTP 不使用此业务信封。
servers:
  - url: /
security:
  - sessionCookie: []
paths:
  /api/auth/login:
    post:
      operationId: authLogin
      security: []
      requestBody: {$ref: '#/components/requestBodies/RPCBody'}
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}}
  /api/auth/logout:
    post:
      operationId: authLogout
      requestBody: {$ref: '#/components/requestBodies/RPCBody'}
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}}
  /api/auth/me:
    get:
      operationId: authMe
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}}
  /api/dashboard/get:
    get:
      operationId: dashboardGet
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}}
  /api/server/list:
    get:
      operationId: serverList
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}}
  /api/server/list-metric-samples:
    get:
      operationId: serverListMetricSamples
      parameters:
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 60, default: 30}
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}}
  /api/server/get-metric-history:
    get:
      operationId: serverGetMetricHistory
      parameters:
        - {$ref: '#/components/parameters/ServerID'}
        - name: hours
          in: query
          schema: {type: integer, minimum: 1, maximum: 24, default: 24}
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}}
  /api/server/list-commands:
    get:
      operationId: serverListCommands
      parameters:
        - {$ref: '#/components/parameters/ServerID'}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 200}
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}}
  /api/server/create:
    post:
      operationId: serverCreate
      requestBody: {$ref: '#/components/requestBodies/RPCBody'}
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}}
  /api/server/update:
    post:
      operationId: serverUpdate
      requestBody: {$ref: '#/components/requestBodies/RPCBody'}
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}}
  /api/server/confirm-renewal:
    post:
      operationId: serverConfirmRenewal
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConfirmRenewalRequest'}
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}}
  /api/server/delete:
    post:
      operationId: serverDelete
      requestBody: {$ref: '#/components/requestBodies/RPCBody'}
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}}
  /api/server/rotate-token:
    post:
      operationId: serverRotateToken
      requestBody: {$ref: '#/components/requestBodies/RPCBody'}
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}}
  /api/server/repair:
    post:
      operationId: serverRepair
      requestBody: {$ref: '#/components/requestBodies/RPCBody'}
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}}
  /api/server/upgrade-xray:
    post:
      operationId: serverUpgradeXray
      requestBody: {$ref: '#/components/requestBodies/RPCBody'}
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}}
  /api/server/upgrade-agent:
    post:
      operationId: serverUpgradeAgent
      requestBody: {$ref: '#/components/requestBodies/RPCBody'}
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}}
  /api/server/list-release-versions:
    get:
      operationId: serverListReleaseVersions
      parameters:
        - name: kind
          in: query
          required: true
          schema: {type: string, enum: [agent, xray]}
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}}
  /api/provider/list:
    get:
      operationId: providerList
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}}
  /api/provider/create:
    post:
      operationId: providerCreate
      requestBody: {$ref: '#/components/requestBodies/RPCBody'}
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}}
  /api/provider/update:
    post:
      operationId: providerUpdate
      requestBody: {$ref: '#/components/requestBodies/RPCBody'}
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}}
  /api/provider/delete:
    post:
      operationId: providerDelete
      requestBody: {$ref: '#/components/requestBodies/RPCBody'}
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}}
  /api/exchange-rate/list:
    get:
      operationId: exchangeRateList
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}}
  /api/exchange-rate/refresh:
    post:
      operationId: exchangeRateRefresh
      requestBody: {$ref: '#/components/requestBodies/RPCBody'}
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}}
  /api/exchange-rate/save-custom:
    post:
      operationId: exchangeRateSaveCustom
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CustomExchangeRate'}
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}}
  /api/exchange-rate/delete-custom:
    post:
      operationId: exchangeRateDeleteCustom
      requestBody: {$ref: '#/components/requestBodies/RPCBody'}
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}}
  /api/node/list:
    get:
      operationId: nodeList
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}}
  /api/node/create:
    post:
      operationId: nodeCreate
      requestBody: {$ref: '#/components/requestBodies/RPCBody'}
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}}
  /api/node/retry:
    post:
      operationId: nodeRetry
      requestBody: {$ref: '#/components/requestBodies/RPCBody'}
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}}
  /api/node/delete:
    post:
      operationId: nodeDelete
      requestBody: {$ref: '#/components/requestBodies/RPCBody'}
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}}
  /api/chain/list:
    get:
      operationId: chainList
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}}
  /api/chain/create:
    post:
      operationId: chainCreate
      requestBody: {$ref: '#/components/requestBodies/RPCBody'}
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}}
  /api/chain/edit:
    post:
      operationId: chainEdit
      description: Creates a desired revision for ordered 1-4 hop topology and deploys changed pieces exit-to-entry.
      requestBody: {$ref: '#/components/requestBodies/RPCBody'}
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}}
  /api/chain/force-publish:
    post:
      operationId: chainForcePublish
      description: Immediately promotes the desired revision as unconfirmed; queued Agent tasks continue without rollback.
      requestBody: {$ref: '#/components/requestBodies/RPCBody'}
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}}
  /api/chain/set-traffic-multiplier:
    post:
      operationId: chainSetTrafficMultiplier
      requestBody: {$ref: '#/components/requestBodies/RPCBody'}
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}}
  /api/chain/reset-traffic:
    post:
      operationId: chainResetTraffic
      requestBody: {$ref: '#/components/requestBodies/RPCBody'}
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}}
  /api/chain/get-traffic-history:
    get:
      operationId: chainGetTrafficHistory
      parameters:
        - {name: chain_id, in: query, required: true, schema: {type: integer, minimum: 1}}
        - {name: hop_id, in: query, schema: {type: integer, minimum: 0, default: 0}}
        - {name: days, in: query, schema: {type: integer, minimum: 1, maximum: 730, default: 30}}
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}}
  /api/chain/retry:
    post:
      operationId: chainRetry
      requestBody: {$ref: '#/components/requestBodies/RPCBody'}
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}}
  /api/chain/delete:
    post:
      operationId: chainDelete
      requestBody: {$ref: '#/components/requestBodies/RPCBody'}
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}}
  /api/user/list:
    get:
      operationId: userList
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}}
  /api/user/create:
    post:
      operationId: userCreate
      requestBody: {$ref: '#/components/requestBodies/RPCBody'}
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}}
  /api/user/update:
    post:
      operationId: userUpdate
      requestBody: {$ref: '#/components/requestBodies/RPCBody'}
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}}
  /api/user/set-nodes:
    post:
      operationId: userSetNodes
      requestBody: {$ref: '#/components/requestBodies/RPCBody'}
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}}
  /api/user/delete:
    post:
      operationId: userDelete
      requestBody: {$ref: '#/components/requestBodies/RPCBody'}
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}}
  /api/setting/get:
    get:
      operationId: settingGet
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}}
  /api/setting/update:
    post:
      operationId: settingUpdate
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SettingUpdateRequest'}
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}}
  /api/setting/change-password:
    post:
      operationId: settingChangePassword
      requestBody: {$ref: '#/components/requestBodies/RPCBody'}
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}}
  /api/setting/test-alerts:
    post:
      operationId: settingTestAlerts
      requestBody: {$ref: '#/components/requestBodies/RPCBody'}
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}}
  /api/panel/restart:
    post:
      operationId: panelRestart
      requestBody: {$ref: '#/components/requestBodies/RPCBody'}
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}}
  /api/panel/state:
    get:
      operationId: panelState
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}}
  /api/panel/get-version:
    get:
      operationId: panelGetVersion
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}}
  /api/panel/start-update:
    post:
      operationId: panelStartUpdate
      requestBody: {$ref: '#/components/requestBodies/RPCBody'}
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}}
  /api/panel/get-update-status:
    get:
      operationId: panelGetUpdateStatus
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}}
  /api/backup/download:
    get:
      operationId: backupDownload
      responses:
        '200':
          description: SQLite attachment or RPC error envelope
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
            application/json:
              schema: {$ref: '#/components/schemas/RPCEnvelope'}
  /api/log/list-operations:
    get:
      operationId: logListOperations
      parameters:
        - {name: severity, in: query, schema: {type: string}}
        - {name: category, in: query, schema: {type: string}}
        - {name: server_id, in: query, schema: {type: integer}}
        - {name: operator, in: query, schema: {type: string}}
        - {name: q, in: query, schema: {type: string}}
        - {name: from, in: query, schema: {type: string}}
        - {name: to, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer}}
        - {name: offset, in: query, schema: {type: integer}}
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}}
  /api/log/clear-operations:
    post:
      operationId: logClearOperations
      requestBody: {$ref: '#/components/requestBodies/RPCBody'}
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}}
  /api/log/list-requests:
    get:
      operationId: logListRequests
      parameters:
        - name: limit
          in: query
          schema: {type: integer, enum: [10, 30, 50, 100], default: 30}
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}}
  /api/log/clear-requests:
    post:
      operationId: logClearRequests
      requestBody: {$ref: '#/components/requestBodies/RPCBody'}
      responses: {'200': {$ref: '#/components/responses/RPCResponse'}}
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: lattix_session
  parameters:
    ServerID:
      name: server_id
      in: query
      required: true
      schema: {type: integer, minimum: 1}
  requestBodies:
    RPCBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
  responses:
    RPCResponse:
      description: Completed Lattix RPC; inspect body code for business outcome.
      headers:
        X-Request-ID:
          schema: {$ref: '#/components/schemas/MessageID'}
        X-Trace-ID:
          schema: {$ref: '#/components/schemas/MessageID'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/RPCEnvelope'}
  schemas:
    MessageID:
      type: string
      pattern: '^[0-9a-f]{32}$'
    AgentSettings:
      type: object
      additionalProperties: false
      required: [revision, reconnect, telemetry, drift_detection]
      properties:
        revision:
          type: integer
          minimum: 1
          description: Read-only to clients; panel increments it when saving.
        reconnect:
          type: object
          additionalProperties: false
          required: [mode, max_retries]
          properties:
            mode: {type: string, enum: [infinite, limited], default: infinite}
            max_retries: {type: integer, minimum: 1, maximum: 100, default: 10}
        telemetry:
          type: object
          additionalProperties: false
          required: [interval_seconds]
          properties:
            interval_seconds: {type: integer, minimum: 10, maximum: 3600, default: 60}
        drift_detection:
          type: object
          additionalProperties: false
          required: [interval_seconds]
          properties:
            interval_seconds: {type: integer, minimum: 5, maximum: 3600, default: 15}
    SettingUpdateRequest:
      type: object
      description: Existing panel fields plus the complete global Agent settings object.
      additionalProperties: true
      properties:
        traffic_timezone:
          type: string
          default: Asia/Shanghai
          description: IANA timezone used for chain traffic day/month bucket boundaries.
        agent: {$ref: '#/components/schemas/AgentSettings'}
        release_inspection: {$ref: '#/components/schemas/ReleaseInspectionSettings'}
        billing_inspection: {$ref: '#/components/schemas/InspectionSchedule'}
        exchange_rate_inspection: {$ref: '#/components/schemas/InspectionSchedule'}
        reporting_currency: {$ref: '#/components/schemas/Currency'}
    Currency:
      type: string
      description: Supported ISO 4217 currency code.
      enum: [AUD, BRL, CAD, CHF, CNY, CZK, DKK, EUR, GBP, HKD, HUF, IDR, ILS, INR, ISK, JPY, KRW, MXN, MYR, NOK, NZD, PHP, PLN, RON, SEK, SGD, THB, TRY, USD, ZAR]
    BillingInput:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled: {type: boolean, default: false}
        provider_id: {type: integer, minimum: 1}
        amount_minor: {type: integer, minimum: 0, description: Original price in the currency's minor unit.}
        currency: {$ref: '#/components/schemas/Currency'}
        service_started_on: {type: string, format: date}
        interval_count: {type: integer, minimum: 1, maximum: 10000}
        interval_unit: {type: string, enum: [day, month, year]}
        next_renewal_on: {type: string, format: date}
    ConvertedCost:
      type: object
      additionalProperties: false
      required: [amount_minor, currency, rate_date, source]
      properties:
        amount_minor: {type: integer, description: Converted value in the reporting currency's minor unit.}
        currency: {$ref: '#/components/schemas/Currency'}
        rate_date: {type: string, description: Public cache date; empty for an identity conversion.}
        source: {type: string, enum: [identity, frankfurter, custom_anchor]}
        anchor_currency: {type: string, description: Present for custom_anchor results.}
    BillingProfile:
      type: object
      description: Server billing data. Public conversion is always attempted; custom conversion is present only when an enabled anchor target matches the reporting currency.
      properties:
        enabled: {type: boolean}
        amount_minor: {type: integer}
        currency: {$ref: '#/components/schemas/Currency'}
        public_converted: {$ref: '#/components/schemas/ConvertedCost'}
        custom_converted: {$ref: '#/components/schemas/ConvertedCost'}
    TrafficPlanInput:
      type: object
      additionalProperties: false
      required: [quota_bytes, accounting_mode, reset_anchor_on, reset_count, reset_unit]
      properties:
        quota_bytes: {type: [integer, 'null'], minimum: 1, description: Decimal bytes; null means unlimited.}
        accounting_mode: {type: string, enum: [outbound, bidirectional, max]}
        reset_anchor_on: {type: string, format: date}
        reset_count: {type: integer, minimum: 1, maximum: 10000}
        reset_unit: {type: string, enum: [day, month, year]}
    ConfirmRenewalRequest:
      type: object
      additionalProperties: false
      required: [server_id, next_renewal_on]
      properties:
        server_id: {type: integer, minimum: 1}
        next_renewal_on: {type: string, format: date, description: Must be later than today in the panel timezone.}
    CustomExchangeRate:
      type: object
      description: Source currency is unique. On create, target_currency is overwritten with the panel reporting currency. At least one amount must equal 1. A rate is applied only while enabled and its target matches the current reporting currency.
      additionalProperties: false
      required: [id, source_currency, source_amount, target_currency, target_amount, enabled]
      properties:
        id: {type: integer, minimum: 0, description: Zero creates a new rate; a positive ID updates it.}
        source_currency: {$ref: '#/components/schemas/Currency'}
        source_amount: {type: string, pattern: '^[0-9]+(?:\\.[0-9]+)?$', description: Source-side major-unit amount; this or target_amount must equal 1.}
        target_currency: {$ref: '#/components/schemas/Currency'}
        target_amount: {type: string, pattern: '^[0-9]+(?:\\.[0-9]+)?$', description: Reporting-currency major-unit amount; this or source_amount must equal 1.}
        enabled: {type: boolean}
    InspectionSchedule:
      type: object
      additionalProperties: false
      required: [every, unit]
      properties:
        every: {type: integer, minimum: 1, maximum: 10000}
        unit: {type: string, enum: [minute, hour, day, month, year]}
        at: {type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'}
    ReleaseInspectionSettings:
      type: object
      additionalProperties: false
      required: [agent, xray]
      properties:
        agent: {$ref: '#/components/schemas/InspectionSchedule'}
        xray: {$ref: '#/components/schemas/InspectionSchedule'}
    RPCCode:
      type: string
      enum:
        - OK
        - ACCEPTED
        - AUTH_REQUIRED
        - AUTH_INVALID_CREDENTIALS
        - INVALID_ARGUMENT
        - NOT_FOUND
        - CONFLICT
        - OPERATION_LOCKED
        - UNSUPPORTED_ACTION
        - INTERNAL_ERROR
        - UPSTREAM_ERROR
        - SERVICE_UNAVAILABLE
        - SERVER_OFFLINE
        - PORT_OUT_OF_RANGE
        - UPDATE_IN_PROGRESS
    RPCEnvelope:
      type: object
      additionalProperties: false
      required: [code, message, data, request_id, trace_id]
      properties:
        code: {$ref: '#/components/schemas/RPCCode'}
        message: {type: string}
        data: {}
        request_id: {$ref: '#/components/schemas/MessageID'}
        trace_id: {$ref: '#/components/schemas/MessageID'}
