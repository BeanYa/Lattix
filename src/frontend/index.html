<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#45405f" />
    <title>Lattix 管理面板</title>
  </head>
  <body>
    <!--
    THESIS: Lattix is a chain-led operating console, not a generic metric-card dashboard or a server-first topology browser.
    OWN-WORLD: Brushed aluminum command rails, charcoal enamel bays, signal-blue live paths, rare orange faults, olive healthy states, engraved seams, and condensed equipment labels.
    STORY: The operator reads fleet health, selects an existing chain, traces its ordered topology, sees current exceptions, and inspects the entry server without leaving the workbench.
    FIRST VIEWPORT: A narrow charcoal navigation rail frames a compact aluminum status strip; grouped totals sit above a chain selector and dominant route bay, a narrow incident dock, and a full-width entry-server instrument rail.
    FORM: Command Rail, grounded structure 6; surface seed 44f01ce4.
    FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
    -->
    <div id="root"></div>
    <script>
      // 首屏前应用持久化的主题，避免亮色/主题切换闪白。
      // 主题 id 只做格式校验，合法性由 ThemeProvider 按注册表纠正。
      try {
        var t = localStorage.getItem('lattix-theme')
        if (t === 'light') document.documentElement.style.colorScheme = 'light'
        else {
          document.documentElement.classList.add('dark')
          document.documentElement.style.colorScheme = 'dark'
        }
        var d = localStorage.getItem('lattix-design-theme')
        document.documentElement.dataset.theme = /^[a-z][a-z0-9-]*$/.test(d || '') ? d : 'hig'
      } catch (e) {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
