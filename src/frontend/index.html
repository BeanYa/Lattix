<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#45405f" />
    <title>Lattix 管理面板</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // 首屏前应用持久化的主题，避免亮色/主题切换闪白。
      // 主题 id 只做格式校验，合法性由 ThemeProvider 按注册表纠正。
      try {
        var t = localStorage.getItem('lattix-theme')
        if (t === 'light') document.documentElement.style.colorScheme = 'light'
        else { document.documentElement.classList.add('dark'); document.documentElement.style.colorScheme = 'dark' }
        var d = localStorage.getItem('lattix-design-theme')
        document.documentElement.dataset.theme = /^[a-z][a-z0-9-]*$/.test(d || '') ? d : 'hig'
      } catch (e) {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
